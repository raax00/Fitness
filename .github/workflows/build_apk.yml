name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual build trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ==========================================
      # 🔥 THE FIX FOR "UNSUPPORTED GRADLE" 🔥
      # Purana android folder delete karke fresh banayenge
      # ==========================================
      - name: Recreate Fresh Android Folder
        run: |
          rm -rf android/
          flutter create --platforms=android .

      # ==========================================
      # 🔥 MODERN AUTO INJECTION (For New Flutter) 🔥
      # ==========================================
      - name: Auto-Inject Firebase & Permissions (Modern Way)
        run: |
          # 1. AndroidManifest.xml mein Internet Permission inject karna
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml || true
          
          # 2. Naye structure (settings.gradle) mein Google Services plugin add karna
          sed -i '/id "com.android.application"/a \    id "com.google.gms.google-services" version "4.4.1" apply false' android/settings.gradle || true
          
          # 3. app/build.gradle mein plugin apply karna
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a \    id "com.google.gms.google-services"' android/app/build.gradle || true

      - name: Auto-Inject google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Secret ko padh kar file create karna
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeenConnect-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
