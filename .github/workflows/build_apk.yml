name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual build trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Cache enabled karne se build fast hoga
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # (Optional) Agar aapne google-services.json GitHub me commit NAHI kiya hai aur 
      # Secrets me daala hai, toh sirf is step ko uncomment karna. 
      # Agar commit kiya hua hai repository me, toh iski zaroorat NAHI hai.
      # - name: Setup Firebase from Secret
      #   env:
      #     GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      #   run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PremiumStore-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
