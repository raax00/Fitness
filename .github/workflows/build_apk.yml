name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual build trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ==========================================
      # 🔥 THE MAGIC FIX FOR V1 EMBEDDING 🔥
      # Bina Android folder delete kiye, purane code ko Auto-Update karega
      # ==========================================
      - name: Auto-Fix Android V1 Embedding
        run: |
          # 1. AndroidManifest me v2 metadata add karega (agar pehle se nahi hai)
          if ! grep -q 'android:name="flutterEmbedding"' android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/a \        <meta-data android:name="flutterEmbedding" android:value="2" />' android/app/src/main/AndroidManifest.xml
          fi
          
          # 2. Java aur Kotlin files me purana V1 import hata kar Naya V2 lagayega
          if [ -d "android/app/src/main/java" ]; then
            find android/app/src/main/java -type f -name "*.java" -exec sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' {} +
          fi
          if [ -d "android/app/src/main/kotlin" ]; then
            find android/app/src/main/kotlin -type f -name "*.kt" -exec sed -i 's/io.flutter.app.FlutterActivity/io.flutter.embedding.android.FlutterActivity/g' {} +
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PremiumStore-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
