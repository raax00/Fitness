name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual build trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          # Yahan se cache: gradle hata diya gaya hai taaki error na aaye

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Yeh step sabse zaroori hai: Agar Android folder nahi hai, toh yeh khud bana dega
      - name: Create/Fix Flutter Project Files
        run: flutter create .

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release Mode)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesiFitness-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
