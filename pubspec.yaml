name: desi_fitness
description: "A Desi Fitness and Diet App with iOS Style UI."

# The following line prevents the package from being accidentally published to pub.dev
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^3.0.0

flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Agar future mein aapko koi custom font (jaise Apple ka San Francisco) 
  # add karna ho, toh yahan uncomment karke add kar sakte hain:
  # fonts:
  #   - family: San Francisco
  #     fonts:
  #       - asset: fonts/SF-Pro.ttf
