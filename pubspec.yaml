name: desi_fitness
description: "A Desi Fitness and Diet App with iOS Style UI."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # iOS Style Icons
  cupertino_icons: ^1.0.8

  # Firebase Dependencies (Authentication, Database)
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6 

  # UPI Payment App Open karne ke liye (Ye package miss tha, ab fix ho gaya ✅)
  url_launcher: ^6.2.6

  # Local Storage ke liye (Aapki 'preference' wali demand ✅)
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
